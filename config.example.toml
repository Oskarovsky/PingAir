# PingAir — skopiuj do config.toml i dostosuj.
# cp config.example.toml config.toml

poll_interval_secs = 900          # 15 min
db_path = "data/pingair.db"
provider = "mock"                 # "mock" | "amadeus"

[amadeus]
# https://developers.amadeus.com/ — Self-Service → Flight Offers Search
client_id = ""
client_secret = ""
# "test" = test.api.amadeus.com, "production" = api.amadeus.com
hostname = "test"

[alert]
# Alarm gdy cena ≤ średnia * (1 - drop_pct/100), po min_samples pomiarach
drop_pct = 12.0
min_samples = 8
# Ile godzin wstecz bierze rolling mean (0 = cała historia trasy)
window_hours = 168
# Nie spamuj tym samym alarmem częściej niż co N godzin
cooldown_hours = 12

[alert.ntfy]
enabled = true
server = "https://ntfy.sh"
topic = "pingair-CHANGE-ME"

[alert.telegram]
enabled = false
bot_token = ""
chat_id = ""

# Trasy do monitorowania — dodawaj bloki [[routes]]
[[routes]]
name = "WAW → BCN (przykład)"
origin = "WAW"
destination = "BCN"
depart_date = "2026-04-10"
return_date = "2026-04-17"
adults = 1
currency = "PLN"

[[routes]]
name = "KRK → MAD"
origin = "KRK"
destination = "MAD"
depart_date = "2026-05-01"
return_date = ""
adults = 1
currency = "PLN"
