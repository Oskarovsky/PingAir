# Szablon produkcji — skopiuj na serwer jako /opt/pingair/config.toml
# NIE commituj prawdziwego config.toml (token, Amadeus, Telegram).
# Po zmianie na serwerze: sudo systemctl restart pingair

poll_interval_secs = 900
db_path = "/opt/pingair/data/pingair.db"
provider = "mock"

[amadeus]
client_id = ""
client_secret = ""
hostname = "test"

[alert]
drop_pct = 12.0
min_samples = 8
window_hours = 168
cooldown_hours = 12

[alert.ntfy]
enabled = false
server = "https://ntfy.sh"
topic = "pingair-CHANGE-ME"

[alert.telegram]
enabled = false
bot_token = ""
chat_id = ""

[ui]
enabled = true
bind = "127.0.0.1:3850"
token = "CHANGE-ME"   # openssl rand -hex 16

[[routes]]
name = "WAW → BCN"
origin = "WAW"
destination = "BCN"
depart_date = "2026-04-10"
return_date = "2026-04-17"
adults = 1
currency = "PLN"

[[routes]]
name = "KRK → MAD"
origin = "KRK"
destination = "MAD"
depart_date = "2026-05-01"
return_date = ""
adults = 1
currency = "PLN"
